<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrevue | Loïc St-Martin</title>
<style>
  html, body { margin: 0; padding: 0; background: #1D421F; }
</style>
</head>
<body>

<!-- ============================================================
     Carrousel | Loïc St-Martin, Analyste financier
     Version légère : aucune dépendance, aucun runtime externe.
     Pour ajouter ou enlever une diapo : dupliquer un <li>.
     Les pastilles se génèrent toutes seules.
     ============================================================ -->

<div class="rec-carousel" data-autoplay="7000" aria-roledescription="carrousel" aria-label="Entrevue avec Loïc St-Martin">

  <ul class="rec-track" tabindex="0" aria-live="polite">

    <li class="rec-slide" role="group" aria-roledescription="diapositive" aria-label="1 sur 6">
      <picture>
        <source type="image/webp" srcset="images/Loic.webp?v=1 1x, images/Loic_2x.webp?v=1 2x">
        <img src="images/Loic.jpg?v=1" srcset="images/Loic.jpg?v=1 1x, images/Loic_2x.jpg?v=1 2x"
             width="800" height="800" fetchpriority="high"
             alt="Loïc St-Martin, Analyste financier. 10 mois chez Sollio Groupe Coopératif.">
      </picture>
    </li>

    <li class="rec-slide" role="group" aria-roledescription="diapositive" aria-label="2 sur 6">
      <picture>
        <source type="image/webp" srcset="images/Loic2.webp?v=1 1x, images/Loic2_2x.webp?v=1 2x">
        <img src="images/Loic2.jpg?v=1" srcset="images/Loic2.jpg?v=1 1x, images/Loic2_2x.jpg?v=1 2x"
             width="800" height="800" loading="lazy" decoding="async"
             alt="Question 1 : Qu'est-ce qui t'a attiré dans notre champ de coopération? Ce qui m'a attiré chez Sollio Groupe Coopératif, c'est surtout la possibilité de travailler dans une grande entreprise, tout en étant dans un environnement coopératif.">
      </picture>
    </li>

    <li class="rec-slide" role="group" aria-roledescription="diapositive" aria-label="3 sur 6">
      <picture>
        <source type="image/webp" srcset="images/Loic3.webp?v=1 1x, images/Loic3_2x.webp?v=1 2x">
        <img src="images/Loic3.jpg?v=1" srcset="images/Loic3.jpg?v=1 1x, images/Loic3_2x.jpg?v=1 2x"
             width="800" height="800" loading="lazy" decoding="async"
             alt="Question 2 : Qu'est-ce qui t'enthousiasme le plus dans ton rôle? Beaucoup de choses! Mon poste correspond vraiment aux défis professionnels que je recherchais et me permet de faire exactement ce que je souhaitais comme comptable.">
      </picture>
    </li>

    <li class="rec-slide" role="group" aria-roledescription="diapositive" aria-label="4 sur 6">
      <picture>
        <source type="image/webp" srcset="images/Loic4.webp?v=1 1x, images/Loic4_2x.webp?v=1 2x">
        <img src="images/Loic4.jpg?v=1" srcset="images/Loic4.jpg?v=1 1x, images/Loic4_2x.jpg?v=1 2x"
             width="800" height="800" loading="lazy" decoding="async"
             alt="Question 3 : Quelle a été ta première impression de l'équipe et de l'organisation? Ce qui m'a marqué, c'est que la coopération n'est pas juste une valeur sur papier, on la voit vraiment dans la façon de travailler au quotidien.">
      </picture>
    </li>

    <li class="rec-slide" role="group" aria-roledescription="diapositive" aria-label="5 sur 6">
      <picture>
        <source type="image/webp" srcset="images/Loic5.webp?v=1 1x, images/Loic5_2x.webp?v=1 2x">
        <img src="images/Loic5.jpg?v=1" srcset="images/Loic5.jpg?v=1 1x, images/Loic5_2x.jpg?v=1 2x"
             width="800" height="800" loading="lazy" decoding="async"
             alt="Question 4 : Quelle est l'une de tes passions en dehors du travail? Le sport! J'ai nagé pendant plusieurs années et je pratique le sauvetage sportif, le golf et la randonnée.">
      </picture>
    </li>

    <li class="rec-slide" role="group" aria-roledescription="diapositive" aria-label="6 sur 6">
      <picture>
        <source type="image/webp" srcset="images/Loic6.webp?v=1 1x, images/Loic6_2x.webp?v=1 2x">
        <img src="images/Loic6.jpg?v=1" srcset="images/Loic6.jpg?v=1 1x, images/Loic6_2x.jpg?v=1 2x"
             width="800" height="800" loading="lazy" decoding="async"
             alt="Question 5 : Si tu pouvais développer une nouvelle compétence dès demain, laquelle aimerais-tu apprendre? Réussir à faire un backflip ou, à l'autre extrême, devenir polyglotte.">
      </picture>
    </li>

  </ul>

  <button class="rec-arrow rec-prev" type="button" aria-label="Diapositive précédente">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M15 4 7 12l8 8"/></svg>
  </button>

  <button class="rec-arrow rec-next" type="button" aria-label="Diapositive suivante">
    <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 4l8 8-8 8"/></svg>
  </button>

  <div class="rec-dots" role="tablist" aria-label="Choisir une diapositive"></div>

</div>


<style>
.rec-carousel {
  --rec-bg: #1D421F;
  --rec-fg: #FFFFFF;
  --rec-accent: #A3C956;
  position: relative;
  max-width: 800px;
  margin-inline: auto;
  background: var(--rec-bg);
  overflow: hidden;
}

/* Piste : le défilement natif fait tout le travail (swipe, inertie, clavier) */
.rec-track {
  display: flex;
  margin: 0;
  padding: 0;
  list-style: none;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  scroll-behavior: smooth;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.rec-track::-webkit-scrollbar { display: none; }
.rec-track:focus-visible { outline: 3px solid var(--rec-accent); outline-offset: -3px; }

.rec-slide {
  flex: 0 0 100%;
  scroll-snap-align: center;
}
.rec-slide picture { display: block; }
.rec-slide img {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1 / 1;
  object-fit: cover;
}

/* Flèches */
.rec-arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 44px;
  height: 44px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: rgba(0, 0, 0, .25);
  color: var(--rec-fg);
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: background .2s, opacity .2s;
}
.rec-arrow:hover { background: rgba(0, 0, 0, .5); }
.rec-arrow:focus-visible { outline: 3px solid var(--rec-accent); outline-offset: 2px; }
.rec-arrow[disabled] { opacity: .25; cursor: default; }
.rec-prev { left: 12px; }
.rec-next { right: 12px; }
.rec-arrow svg {
  width: 22px;
  height: 22px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* Pastilles */
.rec-dots {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 22px;
  display: flex;
  justify-content: center;
  gap: 12px;
}
.rec-dot {
  width: 13px;
  height: 13px;
  border: 2px solid var(--rec-fg);
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  padding: 0;
  transition: background .2s, border-color .2s;
}
.rec-dot:hover { background: rgba(255, 255, 255, .2); }
.rec-dot[aria-selected="true"] { background: var(--rec-accent); border-color: var(--rec-accent); }
.rec-dot:focus-visible { outline: 3px solid var(--rec-accent); outline-offset: 3px; }

/* Responsive */
@media (max-width: 480px) {
  .rec-arrow { width: 38px; height: 38px; }
  .rec-prev { left: 6px; }
  .rec-next { right: 6px; }
  .rec-dots { bottom: 14px; gap: 9px; }
  .rec-dot { width: 11px; height: 11px; }
}

@media (prefers-reduced-motion: reduce) {
  .rec-track { scroll-behavior: auto; }
}
</style>

<script>
(function() {
  'use strict';

  function initCarousel(carousel) {
    const track = carousel.querySelector('.rec-track');
    const slides = Array.from(track.querySelectorAll('.rec-slide'));
    const dotsContainer = carousel.querySelector('.rec-dots');
    const prevBtn = carousel.querySelector('.rec-prev');
    const nextBtn = carousel.querySelector('.rec-next');
    const autoplayDelay = parseInt(carousel.dataset.autoplay, 10) || 7000;

    let currentIndex = 0;
    let autoplayId;

    // Créer les pastilles
    slides.forEach((_, idx) => {
      const dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'rec-dot';
      dot.setAttribute('aria-selected', idx === 0 ? 'true' : 'false');
      dot.setAttribute('aria-label', `Aller à la diapositive ${idx + 1}`);
      dot.addEventListener('click', () => goToSlide(idx));
      dotsContainer.appendChild(dot);
    });

    const dots = dotsContainer.querySelectorAll('.rec-dot');

    function updateCarousel() {
      const slideWidth = track.offsetWidth;
      track.scrollLeft = currentIndex * slideWidth;
      updateDots();
      updateArrows();
    }

    function updateDots() {
      dots.forEach((dot, idx) => {
        dot.setAttribute('aria-selected', idx === currentIndex ? 'true' : 'false');
      });
    }

    function updateArrows() {
      prevBtn.disabled = currentIndex === 0;
      nextBtn.disabled = currentIndex === slides.length - 1;
    }

    function goToSlide(idx) {
      currentIndex = Math.max(0, Math.min(idx, slides.length - 1));
      clearAutoplay();
      updateCarousel();
      restartAutoplay();
    }

    function nextSlide() {
      if (currentIndex < slides.length - 1) {
        goToSlide(currentIndex + 1);
      }
    }

    function prevSlide() {
      if (currentIndex > 0) {
        goToSlide(currentIndex - 1);
      }
    }

    function startAutoplay() {
      autoplayId = setInterval(nextSlide, autoplayDelay);
    }

    function clearAutoplay() {
      clearInterval(autoplayId);
    }

    function restartAutoplay() {
      startAutoplay();
    }

    // Événements
    prevBtn.addEventListener('click', prevSlide);
    nextBtn.addEventListener('click', nextSlide);

    track.addEventListener('scroll', () => {
      const slideWidth = track.offsetWidth;
      const newIndex = Math.round(track.scrollLeft / slideWidth);
      if (newIndex !== currentIndex) {
        currentIndex = newIndex;
        updateDots();
        updateArrows();
        clearAutoplay();
        restartAutoplay();
      }
    });

    track.addEventListener('mouseenter', clearAutoplay);
    track.addEventListener('mouseleave', restartAutoplay);

    // Clavier
    track.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevSlide();
      if (e.key === 'ArrowRight') nextSlide();
    });

    // Init
    updateCarousel();
    startAutoplay();
  }

  document.querySelectorAll('.rec-carousel').forEach(initCarousel);
})();
</script>

</body>
</html>
